services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: transport
      POSTGRES_PASSWORD: transport
      POSTGRES_DB: transport
    volumes: [pgdata:/var/lib/postgresql/data]
  api:
    build: .
    env_file: .env
    ports: ["8000:8000"]
    depends_on: [db]
    volumes: ["./secrets:/srv/secrets:ro"]
volumes:
  pgdata:
