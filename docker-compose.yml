services:
  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: transport
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Missing POSTGRES_PASSWORD in .env}
      POSTGRES_DB: transport
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U transport -d transport"]
      interval: 5s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: redis-server --maxmemory 256mb --maxmemory-policy allkeys-lru --save ""
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build: .
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000
    restart: unless-stopped
    init: true
    env_file:
      - .env
    ports:
      - "127.0.0.1:8003:8000"
    environment:
      REDIS_URL: redis://redis:6379/0
      # self-hosted OSRM container; the API falls back to raw GPS when it is unreachable
      OSRM_BASE_URL: http://osrm:5000
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./secrets:/srv/secrets:ro

  # Self-hosted OSRM (OpenStreetMap Bahrain). Free, open-source, no per-request charge.
  # The Geofabrik extract is downloaded at image build time (separate curl stage); first start builds the graph into the osrmdata volume.
  osrm:
    build:
      context: ./docker/osrm
      args:
        OSM_REGION_URL: https://download.geofabrik.de/asia/bahrain-latest.osm.pbf
    image: wasaly-osrm:stable  # named tag so 'docker image prune' never removes it
    restart: unless-stopped
    volumes:
      - osrmdata:/data
    ports:
      - "127.0.0.1:5000:5000"
    healthcheck:
      test: ["CMD", "bash", "-c", "echo > /dev/tcp/127.0.0.1/5000"]
      interval: 10s
      timeout: 3s
      retries: 12
      start_period: 900s

volumes:
  pgdata:
  osrmdata:
