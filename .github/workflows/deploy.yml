name: Deploy to VPS

on:
  push:
    branches: [master]
  workflow_dispatch:

concurrency:
  group: deploy-vps
  cancel-in-progress: false   # never interrupt a deploy that is already running

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          port: ${{ secrets.VPS_PORT || 22 }}
          key: ${{ secrets.VPS_SSH_KEY }}
          command_timeout: 15m
          script_stop: true
          script: |
            set -o pipefail
            cd /opt/wasaly-api
            git pull origin master
            echo "1.6.$(git rev-list --count HEAD)" > VERSION   # version +1 on every push; read by the API (/health and PCC)
            # 1) backup first (kept: last 14); any failure stops the deployment
            mkdir -p /opt/wasaly-backups
            docker compose exec -T db pg_dump -U transport -d transport | gzip > /opt/wasaly-backups/pre-deploy-$(date +%Y%m%d-%H%M%S).sql.gz
            test -s "$(ls -t /opt/wasaly-backups/*.sql.gz | head -1)"
            ls -t /opt/wasaly-backups/*.sql.gz | tail -n +15 | xargs -r rm -f
            # 2) build the new image, run migrations with it BEFORE the new API starts (failure stops here, old API keeps running)
            docker compose build api
            docker compose run --rm --no-deps api alembic upgrade head
            # 3) only now start/update the containers
            docker compose up -d --build
            docker compose exec -T api python -m scripts.import_translations
            sleep 8
            docker compose ps
            docker compose exec -T api alembic current
            code=$(curl -s -o /dev/null -w "%{http_code}" https://phoenixsystems.online/wasaly-api/health)
            echo "health: $code"
            test "$code" = "200"
            # 4) nginx no-cache header on /control/ (script never fails the deploy)
            bash scripts/nginx_control_nocache.sh || true
            docker compose logs api --tail=20
