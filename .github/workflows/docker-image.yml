name: Docker Image CI

on:
  # PAUSED until further notice (GitHub billing) - deploy manually with: phx-deploy wasaly
  # push:
  #   branches: ["master", "main"]
  # pull_request:
  #   branches: ["master", "main"]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - name: Build the Docker image
        run: docker build . --file Dockerfile --tag wasaly-app-api:${{ github.sha }}
