line-length = 140
target-version = "py312"
extend-exclude = ["alembic/versions"]

[lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501", "B008", "B904", "E741", "E731"]  # B008: FastAPI's Depends() in defaults is the framework idiom

[lint.per-file-ignores]
"tests/*" = ["E402", "E701", "E702", "E731", "B905", "F841", "F811"]
